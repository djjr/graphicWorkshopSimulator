<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Workshop Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div>
      <div id="workshop-title">Workshop Simulator</div>
      <div id="phase-label"></div>
    </div>
    <div style="display:flex; gap:0.5rem; align-items:center;">
      <select id="workshop-select" class="btn-secondary" style="padding:0.3rem;">
        <option value="">Loading...</option>
      </select>
    </div>
  </header>

  <div class="main-area">
    <main id="log"></main>

    <aside id="god-panel">
      <div>
        <h3>Director Controls</h3>
      </div>

      <div>
        <h3>Directives to LLM</h3>
        <textarea id="directive-input" placeholder="e.g. &quot;Make Maya push back harder&quot; or &quot;Start wrapping up this phase&quot;"></textarea>
        <div style="margin-top:0.3rem; display:flex; gap:0.3rem;">
          <button id="add-directive-btn" class="btn-secondary btn-small">Add Directive</button>
          <button id="clear-directives-btn" class="btn-secondary btn-small">Clear All</button>
        </div>
        <div id="directives-list" style="margin-top:0.4rem;"></div>
      </div>

      <div>
        <h3>Speak as Facilitator</h3>
        <input id="facilitator-input" type="text" placeholder="Type a facilitator line..." />
        <div style="margin-top:0.3rem;">
          <button id="facilitator-send-btn" class="btn-secondary btn-small">Inject &amp; Continue</button>
        </div>
      </div>

      <div>
        <button id="export-btn" class="btn-secondary btn-small" style="width:100%;">Export Dialogue JSON</button>
      </div>

      <div>
        <h3>Phases</h3>
        <div id="phase-list"></div>
        <div id="activity-info"></div>
        <div style="margin-top:0.4rem; display:flex; gap:0.3rem;">
          <button id="advance-activity-btn" class="btn-secondary btn-small">Next Activity</button>
          <button id="advance-phase-btn" class="btn-warn btn-small">Advance Phase</button>
        </div>
      </div>
    </aside>
  </div>

  <footer>
    <input id="player-input" type="text" placeholder="Say something as a participant..." />
    <button id="next-btn" class="btn-primary">Next Turn</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
